name: React web

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: services/api/go.sum
      - run: npm ci
      - name: Generated OpenAPI types match the contract
        run: npm run check:api
      - name: Type check
        run: npm run typecheck
      - name: Type check browser tests
        run: npx tsc --noEmit -p e2e/tsconfig.json
      - name: Focused client tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Real Go backend browser acceptance tests
        run: npm run test:e2e
      - name: Build combined production image
        working-directory: .
        run: docker build -f services/api/Dockerfile -t folio:ci .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-artifacts
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
