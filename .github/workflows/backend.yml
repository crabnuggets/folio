name: Go backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: folio
          POSTGRES_PASSWORD: folio-ci-synthetic-only
          POSTGRES_DB: folio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U folio -d folio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://folio:folio-ci-synthetic-only@localhost:5432/folio?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r api/requirements-contract.txt
      - run: python scripts/validate_contract.py
      - name: Check Go formatting
        working-directory: services/api
        run: test -z "$(gofmt -l .)"
      - name: Vet
        working-directory: services/api
        run: go vet ./...
      - name: Unit, HTTP contract and PostgreSQL integration tests
        working-directory: services/api
        run: go test -race -count=1 ./...
      - name: Build
        working-directory: services/api
        run: go build ./cmd/folio
