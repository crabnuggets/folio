name: Go backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: folio
          POSTGRES_PASSWORD: folio-ci-synthetic-only
          POSTGRES_DB: folio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U folio -d folio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://folio:folio-ci-synthetic-only@localhost:5432/folio?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r api/requirements-contract.txt
      - run: python scripts/validate_contract.py
      - name: Check Go formatting
        working-directory: services/api
        run: test -z "$(gofmt -l .)"
      - name: Vet
        working-directory: services/api
        run: go vet ./...
      - name: Unit, HTTP contract and PostgreSQL integration tests
        working-directory: services/api
        shell: bash
        run: |
          mkdir -p test-results
          go test -v -race -count=1 -coverprofile=test-results/coverage.out ./... | tee test-results/go-test.log
      - name: Coverage report
        working-directory: services/api
        run: |
          go tool cover -func=test-results/coverage.out > test-results/coverage.txt
          go tool cover -html=test-results/coverage.out -o test-results/coverage.html
          echo "Go coverage: $(tail -n 1 test-results/coverage.txt)" >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        working-directory: services/api
        run: go build ./cmd/folio
      - name: Upload backend test results and coverage
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: backend-test-results
          path: services/api/test-results/
          retention-days: 7
