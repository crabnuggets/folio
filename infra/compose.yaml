services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: folio
      POSTGRES_PASSWORD: folio-local-only
      POSTGRES_DB: folio
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - folio_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folio -d folio"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  folio_postgres:
