  "components": {
    "securitySchemes": {
      "BearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT or explicit local dev token",
        "description": "Configured single owner only. Local bypass token requires explicit development auth and cannot start in production."
      }
    },
    "parameters": {
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/UUID"
        },
        "description": "Client UUID scoped to owner. Same method/path/body/precondition replays committed status/body/ETag. Different content with same key returns 409. Retained at least 30 days (indefinitely initially)."
      },
      "IfMatch": {
        "name": "If-Match",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "pattern": "^\"[1-9][0-9]*\"$"
        },
        "description": "Strong version ETag returned by current resource read. Missing 428, stale 412."
      },
      "Limit": {
        "name": "limit",
        "in": "query",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 100,
          "default": 50
        }
      },
      "Cursor": {
        "name": "cursor",
        "in": "query",
        "schema": {
          "$ref": "#/components/schemas/UUID"
        },
        "description": "Last returned UUID, exclusive, ordered lexicographically. Null next_cursor marks end."
      },
      "MonthFilter": {
        "name": "month",
        "in": "query",
        "schema": {
          "$ref": "#/components/schemas/MonthValue"
        }
      }
    },
    "schemas": {
      "Money": {
        "type": "string",
        "pattern": "^-?(0|[1-9][0-9]*)$",
        "description": "Canonical signed 64-bit decimal minor-unit integer string. Values outside -9223372036854775808..9223372036854775807 are invalid. Currency exponent comes from settings.",
        "examples": [
          "500000",
          "0",
          "-10000"
        ]
      },
      "UUID": {
        "type": "string",
        "format": "uuid"
      },
      "MonthValue": {
        "type": "string",
        "pattern": "^(19[0-9]{2}|[2-9][0-9]{3})-(0[1-9]|1[0-2])$",
        "examples": [
          "2026-10"
        ]
      },
      "Currency": {
        "type": "string",
        "pattern": "^[A-Z]{3}$",
        "description": "Supported ISO 4217 currency equal to configured settings. Unknown currencies are rejected, never converted.",
        "examples": [
          "SGD"
        ]
      },
      "PlanKind": {
        "type": "string",
        "enum": [
          "income",
          "spending",
          "allocation",
          "funding_inflow",
          "funding_outflow"
        ]
      },
      "EntryKind": {
        "type": "string",
        "enum": [
          "income",
          "direct_expense",
          "refund",
          "reimbursement_receipt",
          "transfer",
          "envelope_funding",
          "envelope_return",
          "allocation",
          "allocation_withdrawal",
          "card_settlement"
        ]
      },
      "Meta": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "$ref": "#/components/schemas/UUID"
          },
          "version": {
            "type": "integer",
            "minimum": 1,
            "format": "int64"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "id",
          "version",
          "created_at",
          "updated_at"
        ]
      },
      "SettingsInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "currency": {
            "$ref": "#/components/schemas/Currency"
          },
          "timezone": {
            "type": "string",
            "description": "IANA timezone name.",
            "examples": [
              "Asia/Singapore"
            ]
          }
        },
        "required": [
          "currency",
          "timezone"
        ]
      },
      "Settings": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "currency": {
            "$ref": "#/components/schemas/Currency"
          },
          "timezone": {
            "type": "string",
            "description": "IANA timezone name.",
            "examples": [
              "Asia/Singapore"
            ]
          },
          "version": {
            "type": "integer",
            "minimum": 1,
            "format": "int64"
          },
          "currency_exponent": {
            "type": "integer",
            "minimum": 0,
            "maximum": 4
          }
        },
        "required": [
          "currency",
          "timezone",
          "version",
          "currency_exponent"
        ]
      },
      "Boundary": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "effective_month": {
            "$ref": "#/components/schemas/MonthValue"
          },
          "included": {
            "type": "boolean"
          }
        },
        "required": [
          "effective_month",
          "included"
        ]
      },
      "AccountInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "alias": {
            "type": "string"
          },
